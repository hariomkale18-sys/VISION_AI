<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2563EB" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background with squircle safe padding -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Radar / Soundwave concentric arcs -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="12 12"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#glow)" stroke-width="8" opacity="0.6"/>

  <!-- Stylized Vision Eye / Brain Core -->
  <g filter="url(#shadow)">
    <!-- Eye outer contour -->
    <path d="M96 256C140 180 196 140 256 140C316 140 372 180 416 256C372 332 316 372 256 372C196 372 140 332 96 256Z" 
          fill="none" stroke="url(#glow)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Central Iris Radar -->
    <circle cx="256" cy="256" r="64" fill="url(#inner)"/>
    <!-- Voice pupil aperture -->
    <circle cx="256" cy="256" r="28" fill="#FFFFFF"/>
  </g>

  <!-- Soundwave vertical bars underneath -->
  <line x1="206" y1="390" x2="206" y2="420" stroke="#38BDF8" stroke-width="10" stroke-linecap="round"/>
  <line x1="231" y1="380" x2="231" y2="430" stroke="#60A5FA" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="372" x2="256" y2="438" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <line x1="281" y1="380" x2="281" y2="430" stroke="#60A5FA" stroke-width="10" stroke-linecap="round"/>
  <line x1="306" y1="390" x2="306" y2="420" stroke="#38BDF8" stroke-width="10" stroke-linecap="round"/>
</svg>
